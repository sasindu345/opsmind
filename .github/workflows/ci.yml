name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest -v

  terraform-validate:
    name: Terraform Infrastructure Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Build Application Archive
        run: |
          chmod +x ../../scripts/package_app.sh
          ../../scripts/package_app.sh

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: opsmind:latest

  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend Bundle
        run: |
          npm ci || npm install
          npm run build

      - name: Package Application Archive
        run: |
          chmod +x scripts/package_app.sh
          ./scripts/package_app.sh

      - name: Configure AWS Credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy via AWS S3 & SSM
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ secrets.OPSMIND_S3_BUCKET || 'opsmind-production-artifacts-p385p6' }}
          INSTANCE_ID: ${{ secrets.OPSMIND_EC2_INSTANCE_ID || 'i-01427e3793c2f09a5' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          echo "Uploading application archive to S3..."
          aws s3 cp dist/opsmind-app.tar.gz s3://${S3_BUCKET}/deploy/opsmind-app.tar.gz

          echo "Dispatching deployment command to EC2 instance via AWS SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://'${S3_BUCKET}'/deploy/opsmind-app.tar.gz /opt/opsmind.tar.gz",
              "tar -xzf /opt/opsmind.tar.gz -C /opt/opsmind",
              "cd /opt/opsmind",
              "/opt/opsmind/.venv/bin/pip install --no-cache-dir -r requirements.txt",
              "systemctl restart opsmind opsmind-worker",
              "sleep 4",
              "curl -f http://localhost:8000/healthz"
            ]' \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for SSM command ${COMMAND_ID} to complete..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --region "${AWS_REGION}"
          echo "Deployment completed successfully via AWS SSM!"

      - name: Deploy via SSH (Alternative fallback)
        if: ${{ env.AWS_ACCESS_KEY_ID == '' && env.EC2_SSH_KEY != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || '98.94.112.228' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no dist/opsmind-app.tar.gz ubuntu@${EC2_HOST}:/tmp/opsmind-app.tar.gz
          ssh -o StrictHostKeyChecking=no ubuntu@${EC2_HOST} "
            sudo tar -xzf /tmp/opsmind-app.tar.gz -C /opt/opsmind
            cd /opt/opsmind
            sudo /opt/opsmind/.venv/bin/pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart opsmind opsmind-worker
            sleep 4
            curl -f http://localhost:8000/healthz
          "
          echo "Deployment completed successfully via SSH!"

      - name: Verify Live Deployment Endpoint
        run: |
          echo "Verifying live endpoint health..."
          curl -f -m 15 http://98.94.112.228:8000/healthz || echo "Health check returned warning"
          curl -f -m 15 http://98.94.112.228:8000/readyz || echo "Readiness check returned warning"
